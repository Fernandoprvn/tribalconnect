services:
  postgres:
    image: postgres:16-alpine
    container_name: tribalconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: tribalconnect_dev
      POSTGRES_DB: tribalconnect
      POSTGRES_USER: tribalconnect
    ports:
      - "5432:5432"
    volumes:
      - tribalconnect-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribalconnect -d tribalconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tribalconnect-postgres:
